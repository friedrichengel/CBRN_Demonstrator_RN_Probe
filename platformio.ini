; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:t_echo]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
; DFU-Reset, Port-Handling und Neuversuche macht tools/dfu_upload.py - Details
; und Begruendung stehen im Kopf des Skripts. PlatformIO darf den Port vorher
; nicht selbst anfassen, sonst faellt der Bootloader raus.
board_upload.disable_flushing = true
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/dfu_upload.py" -pkg $SOURCE

build_flags =
  -DCONFIG_NFCT_PINS_AS_GPIOS
  -DUSE_TINYUSB

lib_ldf_mode = deep+
lib_archive = no

lib_deps =
  adafruit/Adafruit TinyUSB Library@>=3.1.0
  adafruit/Adafruit EPD@^4.5.4
  adafruit/Adafruit GFX Library@^1.11.9