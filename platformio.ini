; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:t_echo]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
monitor_speed = 115200
upload_protocol = nrfutil
; DFU-Reset, Port-Handling und Neuversuche macht tools/dfu_upload.py - Details
; und Begruendung stehen im Kopf des Skripts. PlatformIO darf den Port vorher
; nicht selbst anfassen, sonst faellt der Bootloader raus.
board_upload.disable_flushing = true
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/dfu_upload.py" -pkg $SOURCE

; Nur die T-Echo-Quellen bauen (alles unter src/esp32/ gehoert zur ESP32-Variante).
build_src_filter = +<*> -<esp32/>

build_flags =
  -DCONFIG_NFCT_PINS_AS_GPIOS
  -DUSE_TINYUSB

lib_ldf_mode = deep+
lib_archive = no

lib_deps =
  adafruit/Adafruit TinyUSB Library@>=3.1.0
  adafruit/Adafruit EPD@^4.5.4
  adafruit/Adafruit GFX Library@^1.11.9

[env:xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Nur die ESP32-Quellen bauen.
build_src_filter = -<*> +<esp32/>

; default_8MB.csv (Board-Default) hat zwei App-Slots mit je 3,34 MB -
; reicht fuer BLE + WLAN + OTA ohne Anpassung.
board_build.partitions = default_8MB.csv

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Extended Advertising ist Pflicht: ohne dieses Flag kennt NimBLE kein
  ; Coded PHY, und die Klasse heisst NimBLEAdvertising statt NimBLEExtAdvertising.
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
  -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=1
  -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=254

lib_deps =
  h2zero/NimBLE-Arduino@^2.5.1

; Upload ueber WLAN (Geraet muss im OTA-Fenster sein):
;   pio run -e xiao_s3 -t upload --upload-port strahler-001.local
; upload_protocol = espota
